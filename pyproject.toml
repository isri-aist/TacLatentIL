[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tac_latent_il"
description = "Tactile-based generative policies for imitation learning"
readme = "README.md"
authors = [
  {name = "Masaki Murooka", email = "m-murooka@aist.go.jp"},
]
maintainers = [
  {name = "Masaki Murooka", email = "m-murooka@aist.go.jp"},
]
requires-python = ">= 3.8"
dependencies = []
dynamic = ["version"]

[tool.setuptools.packages.find]
include = ["tac_latent_il", "tac_latent_il.*"]
