[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tac_latent_il"
description = "Tactile-based generative policies for imitation learning"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Masaki Murooka", email = "m-murooka@aist.go.jp"},
]
maintainers = [
  {name = "Masaki Murooka", email = "m-murooka@aist.go.jp"},
]
requires-python = ">= 3.8"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
sparsh = [
  "lightning",
  "xformers",
  "safetensors",
  "scikit-learn",
  "rich",
  "digit-interface",
]
anytouch = [
  "accelerate>=0.33.0",
  "einops>=0.8.0",
  "huggingface_hub<=0.25.0,>=0.24.6",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "transformers>=4.42.3",
  "tensorboard>=2.17.0",
  "tensorboard-data-server>=0.7.2",
  "timm",
  "gdown",
]
unit = [
  "timm==0.9.7",
  "pytorch-lightning>=2.0",
  "wandb",
  "gdown",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]

[tool.setuptools.packages.find]
include = ["tac_latent_il", "tac_latent_il.*"]
